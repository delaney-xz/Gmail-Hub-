<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Portal</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background-color: #0b0f19; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 15px; }
    .badge { background: #10b981; color: #000; padding: 4px 10px; border-radius: 6px; font-weight: bold; }
    .btn-logout { background: #ef4444; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 25px; }
    th, td { border: 1px solid #1f2937; padding: 12px; text-align: left; }
    th { background: #111827; color: #9ca3af; font-size: 13px; text-transform: uppercase; }
    tr:nth-child(even) { background: #0f172a; }
  </style>
</head>
<body>
  <div class="header">
    <h2>Customer Portal</h2>
    <div>
      <span class="badge">AVAILABLE STOCK</span>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Gmail Address</th>
        <th>Password</th>
        <th>Years</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <tr><td colspan="3" style="text-align:center;">Loading accounts...</td></tr>
    </tbody>
  </table>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzdPOjwlwcZLerYM1KStgofzqswB2l4Mqza37ayUU6OiPnRVfbuzNA-E5CKt2DUZaj7WQ/exec';

    async function loadCustomerAccounts() {
      const tbody = document.getElementById('table-body');
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'getAccounts', role: 'customer' })
        });
        const data = await res.json();
        if (data.success && Array.isArray(data.accounts)) {
          const avail = data.accounts.filter(acc => (acc.status || '').toLowerCase() === 'available');
          if (avail.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">No accounts available.</td></tr>';
            return;
          }
          tbody.innerHTML = avail.map(acc => `
            <tr>
              <td>${acc.gmail || ''}</td>
              <td>${acc.password || ''}</td>
              <td>${acc.years || ''}</td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;color:red;">${data.error || 'Failed to load'}</td></tr>`;
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;color:red;">Error: ${err.message}</td></tr>`;
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = './customer-login.html';
    }

    loadCustomerAccounts();
  </script>
</body>
</html>
