<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Portal - Gmail Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b0f19; color: #f3f4f6; padding: 25px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937; padding-bottom: 18px; margin-bottom: 25px; }
    .header h2 { font-size: 22px; color: #60a5fa; }
    .badge { background: #10b981; color: #000; font-weight: 700; padding: 6px 14px; border-radius: 20px; font-size: 13px; text-transform: uppercase; }
    .btn-logout { background: #ef4444; color: #fff; border: none; padding: 7px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-left: 10px; }
    .table-container { background: #111827; border-radius: 8px; border: 1px solid #1f2937; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 14px 18px; border-bottom: 1px solid #1f2937; font-size: 14px; }
    th { background: #1f2937; color: #9ca3af; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
    tr:nth-child(even) { background: #0e1526; }
    tr:hover { background: #162036; }
    .msg-box { text-align: center; padding: 30px; color: #9ca3af; }
    .toast-err { color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <h2>Customer Portal</h2>
    <div>
      <span class="badge">Available Stock</span>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Gmail Address</th>
          <th>Password</th>
          <th>Years</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="3" class="msg-box">Loading accounts from server...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzdPOjwlwcZLerYM1KStgofzqswB2l4Mqza37ayUU6OiPnRVfbuzNA-E5CKt2DUZaj7WQ/exec';
    const API_BASE = SCRIPT_URL;

    async function loadAccounts() {
      const tbody = document.getElementById('table-body');
      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'getAccounts', role: 'customer' })
        });
        const data = await response.json();

        if (data.success && Array.isArray(data.accounts)) {
          const avail = data.accounts.filter(a => (a.status || '').toLowerCase() === 'available');
          if (avail.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" class="msg-box">No accounts available right now.</td></tr>';
            return;
          }
          tbody.innerHTML = avail.map(acc => `
            <tr>
              <td><strong>${acc.gmail || ''}</strong></td>
              <td>${acc.password || ''}</td>
              <td>${acc.years || ''}</td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="3" class="msg-box toast-err">${data.error || 'Failed to load accounts.'}</td></tr>`;
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="3" class="msg-box toast-err">Connection error: ${err.message}</td></tr>`;
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = './customer-login.html';
    }

    window.onload = loadAccounts;
  </script>
</body>
</html>
