<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Portal — Gmail Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body>

<!-- Header -->
<header class="portal-header">
  <div class="portal-header-inner">
    <div class="header-brand">
      <div class="header-brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect width="20" height="16" x="2" y="4" rx="2"/>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
        </svg>
      </div>
      <div>
        <h1>Gmail Hub</h1>
        <p>Available Accounts — Customer View</p>
      </div>
    </div>
    <div class="header-right">
      <div class="live-chip"><div class="pulse-dot"></div><span id="live-clock">--:--:--</span></div>
      <span class="role-chip customer">Customer</span>
      <span class="user-chip" id="user-chip">👤 …</span>
      <button class="btn btn-sm" onclick="doLogout()">Logout</button>
    </div>
  </div>
</header>

<main class="portal-main">
  <!-- Info banner -->
  <div style="background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.2);border-radius:10px;padding:0.75rem 1rem;margin-bottom:1rem;font-size:0.83rem;color:var(--text-secondary);display:flex;align-items:center;gap:0.5rem;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent-green)" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <span><strong style="color:var(--accent-green);">Customer Mode</strong> — View-only access. Showing all <strong>Available</strong> accounts with live 2FA codes.</span>
  </div>

  <!-- Controls -->
  <div class="control-bar">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="search-input" placeholder="Search by Gmail or Recovery email…" oninput="handleSearch()">
    </div>
    <div class="filter-pills" id="filter-pills">
      <button class="pill active" data-filter="ALL" onclick="setFilter('ALL')">All</button>
    </div>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th style="width:50px">#</th>
          <th>Gmail Address</th>
          <th>Password</th>
          <th style="min-width:180px">Live 2FA Code</th>
          <th>Recovery Email</th>
          <th>Status</th>
          <th style="text-align:right">Actions</th>
        </tr>
      </thead>
      <tbody id="tbl-body">
        <tr><td colspan="7" style="text-align:center;padding:3rem;color:var(--text-muted);">Loading accounts…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<div class="toast-wrap" id="toasts"></div>

<script src="totp.js"></script>
<script>
// ── Auth guard ──────────────────────────────────────────────────────────────
const sessionToken = localStorage.getItem('session_token');
const sessionRole  = localStorage.getItem('session_role');
const sessionUser  = localStorage.getItem('session_username') || '?';

if (!sessionToken || sessionRole !== 'customer') {
  window.location.href = '/customer-login';
}

document.getElementById('user-chip').textContent = '👤 ' + sessionUser;

// Theme
const savedTheme = localStorage.getItem('theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);

// ── State ───────────────────────────────────────────────────────────────────
let accounts   = [];
let filtered   = [];
let searchQ    = '';
let tickerId   = null;

// ── Init ────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  await loadAccounts();
  startTicker();
});

async function loadAccounts() {
  try {
    const res  = await fetch('/api/accounts?role=customer');
    const data = await res.json();
    if (Array.isArray(data)) { accounts = data; }
    applyFilters();
  } catch (e) {
    toast('Failed to load accounts from server.', 'error');
  }
}

function doLogout() {
  localStorage.removeItem('session_token');
  localStorage.removeItem('session_role');
  localStorage.removeItem('session_username');
  window.location.href = '/customer-login';
}

// ── Filters ─────────────────────────────────────────────────────────────────
function setFilter(f) {
  document.querySelectorAll('.pill[data-filter]').forEach(p =>
    p.classList.toggle('active', p.dataset.filter === f));
  applyFilters();
}

function handleSearch() {
  searchQ = document.getElementById('search-input').value.trim().toLowerCase();
  applyFilters();
}

function applyFilters() {
  filtered = accounts.filter(a => {
    if (searchQ) {
      const g = (a.gmail || '').toLowerCase();
      const r = (a.recoveryEmail || '').toLowerCase();
      if (!g.includes(searchQ) && !r.includes(searchQ) && !String(a.serial).includes(searchQ)) return false;
    }
    return true;
  });
  renderTable();
}

// ── Render ──────────────────────────────────────────────────────────────────
function renderTable() {
  const tbody  = document.getElementById('tbl-body');
  const nowSec = Math.floor(Date.now() / 1000);

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:3rem;color:var(--text-muted);">No accounts available at this time.</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(a => {
    // Password
    let passCell;
    if (a.hidePasswordFromCustomer || !a.password) {
      passCell = `<span class="pass-hidden-label"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Hidden</span>`;
    } else {
      passCell = `<div class="cell-row"><span class="mono">${esc(a.password)}</span><button class="copy-btn" onclick="cp('${ej(a.password)}',this,'Password')" title="Copy"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button></div>`;
    }

    // 2FA
    let twoCell;
    if (!a.twoFactorSecret || a.twoFactorSecret.trim() === '') {
      twoCell = `<span class="totp-na">—</span>`;
    } else if (!a.twoFactorSecret || a.hide2FaFromCustomer) {
      twoCell = `<span class="pass-hidden-label">Hidden</span>`;
    } else {
      const r = window.TOTPGenerator.generate(a.twoFactorSecret, nowSec);
      const rem = r.remaining;
      const pct = (rem / 30) * 100;
      const wc  = rem <= 5 ? 'danger' : rem <= 10 ? 'warning' : '';
      twoCell = `
        <div class="totp-box" id="totp-box-${a.id}">
          <div class="totp-row">
            <span class="totp-digits" id="totp-code-${a.id}">${r.formatted || '------'}</span>
            <span class="totp-pill ${wc}" id="totp-pill-${a.id}">${rem}s</span>
            <button class="copy-btn" onclick="copyTotp('${a.id}',this)" title="Copy 2FA code"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button>
          </div>
          <div class="totp-bar-bg"><div class="totp-bar ${wc}" id="totp-bar-${a.id}" style="width:${pct}%"></div></div>
        </div>`;
    }

    // Recovery
    const recCell = a.recoveryEmail
      ? `<div class="cell-row"><span class="mono" style="color:var(--text-secondary)">${esc(a.recoveryEmail)}</span><button class="copy-btn" onclick="cp('${ej(a.recoveryEmail)}',this,'Recovery')" title="Copy"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button></div>`
      : `<span style="color:var(--text-muted)">—</span>`;

    return `
    <tr>
      <td style="font-weight:600;color:var(--text-muted)">${a.serial || '—'}</td>
      <td><div class="cell-row"><span class="mono" style="font-weight:500">${esc(a.gmail)}</span><button class="copy-btn" onclick="cp('${ej(a.gmail)}',this,'Gmail')" title="Copy Gmail"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button></div></td>
      <td>${passCell}</td>
      <td>${twoCell}</td>
      <td>${recCell}</td>
      <td><span class="badge ${esc(a.status || 'Available')}">${esc(a.status || 'Available')}</span></td>
      <td style="text-align:right"><button class="btn btn-sm" onclick="copyAll('${a.id}',this)">Copy All</button></td>
    </tr>`;
  }).join('');
}

// ── TOTP Ticker ──────────────────────────────────────────────────────────────
function startTicker() {
  if (tickerId) clearInterval(tickerId);
  tickerId = setInterval(() => {
    const nowSec = Math.floor(Date.now() / 1000);
    const rem    = 30 - (nowSec % 30);
    const pct    = (rem / 30) * 100;
    const wc     = rem <= 5 ? 'danger' : rem <= 10 ? 'warning' : '';

    document.getElementById('live-clock').textContent = new Date().toTimeString().split(' ')[0];

    for (const a of accounts) {
      if (!a.twoFactorSecret || a.twoFactorSecret.trim() === '' || a.hide2FaFromCustomer) continue;
      const r  = window.TOTPGenerator.generate(a.twoFactorSecret, nowSec);
      const ce = document.getElementById(`totp-code-${a.id}`);
      const pe = document.getElementById(`totp-pill-${a.id}`);
      const be = document.getElementById(`totp-bar-${a.id}`);
      if (ce && ce.textContent !== r.formatted) ce.textContent = r.formatted;
      if (pe) { pe.textContent = `${rem}s`; pe.className = `totp-pill ${wc}`; }
      if (be) { be.style.width = `${pct}%`; be.className = `totp-bar ${wc}`; }
    }
  }, 1000);
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function copyTotp(id, btn) {
  const a = accounts.find(x => x.id === id);
  if (!a || !a.twoFactorSecret) return;
  const r = window.TOTPGenerator.generate(a.twoFactorSecret);
  if (r && r.code) cp(r.code, btn, '2FA Code');
}

function copyAll(id, btn) {
  const a = accounts.find(x => x.id === id);
  if (!a) return;
  let s = `Gmail: ${a.gmail || ''}`;
  if (a.password && !a.hidePasswordFromCustomer) s += `\nPassword: ${a.password}`;
  if (a.recoveryEmail) s += `\nRecovery: ${a.recoveryEmail}`;
  if (a.twoFactorSecret && !a.hide2FaFromCustomer) {
    const r = window.TOTPGenerator.generate(a.twoFactorSecret);
    if (r && r.code) s += `\nLive 2FA: ${r.code}`;
  }
  cp(s, btn, 'Account Info');
}

async function cp(text, btn, label) {
  if (!text) { toast(`Empty ${label}`, 'error'); return; }
  try { await navigator.clipboard.writeText(text); } catch {
    const t = document.createElement('textarea'); t.value = text;
    document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
  }
  toast(`Copied ${label}!`, 'success');
  if (btn) {
    btn.classList.add('copied');
    const orig = btn.innerHTML;
    btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 1500);
  }
}

function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
function ej(s)  { if (!s) return ''; return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function toast(msg, type='info') {
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<span>${esc(msg)}</span>`;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transition='opacity 0.3s'; setTimeout(() => t.remove(), 300); }, 3000);
}
</script>
</body>
</html>
