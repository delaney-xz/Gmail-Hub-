<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worker Login — Gmail Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body class="auth-page">
<div class="auth-card">
  <div class="auth-logo">
    <div class="auth-logo-icon" style="background:linear-gradient(135deg,#d29922,#e3913a);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
    </div>
    <div>
      <h1>Worker Portal</h1>
      <p>Gmail Hub — Staff Access</p>
    </div>
  </div>
  <p class="auth-subtitle" style="margin-bottom:1.5rem;">Enter your worker credentials to access the staff management portal.</p>
  <div class="form-group">
    <label class="form-label">Worker Username</label>
    <input class="form-input" type="text" id="login-user" placeholder="worker_username" autocomplete="username">
  </div>
  <div class="form-group">
    <label class="form-label">Password</label>
    <input class="form-input" type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()">
  </div>
  <div class="form-error" id="login-err"></div>
  <button class="btn btn-primary" id="btn-login" onclick="doLogin()" style="background:linear-gradient(135deg,#d29922,#e3913a);border-color:transparent;">Sign In to Worker Portal</button>
  <p style="text-align:center;font-size:0.75rem;color:var(--text-muted);margin-top:1.5rem;">
    <a href="./customer-login.html" style="color:var(--accent-blue);">Customer Login</a> · 
    <a href="./admin-login.html" style="color:var(--accent-purple);">Admin Login</a>
  </p>
</div>
<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzdPOjwlwcZLerYM1KStgofzqswB2l4Mqza37ayUU6OiPnRVfbuzNA-E5CKt2DUZaj7WQ/exec';
const tok = localStorage.getItem('session_token');
const role = localStorage.getItem('session_role');
if (tok && role === 'worker') { window.location.href = './worker-portal.html'; }
async function doLogin() {
  const btn = document.getElementById('btn-login');
  const errEl = document.getElementById('login-err');
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  errEl.style.display = 'none';
  if (!user || !pass) { showErr(errEl, 'Please enter username and password.'); return; }
  btn.disabled = true; btn.innerText = 'Signing in…';
  try {
    const payload = JSON.stringify({ action: 'workerLogin', username: user, password: pass });
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: payload
    });
    const data = await res.json();
    if (data.success) {
      localStorage.setItem('session_token', data.token);
      localStorage.setItem('session_role', 'worker');
      localStorage.setItem('session_username', data.username);
      window.location.href = './worker-portal.html';
    } else {
      showErr(errEl, data.error || 'Invalid credentials.');
    }
  } catch (e) {
    showErr(errEl, 'Server error. Is the server running?');
  } finally {
    btn.disabled = false; btn.innerText = 'Sign In to Worker Portal';
  }
}
function showErr(el, msg) { el.innerText = msg; el.style.display = 'block'; }
</script>
</body>
</html>
